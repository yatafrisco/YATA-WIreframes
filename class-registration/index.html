<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YATA - Class Detail &amp; Registration</title>
<style>
  :root{
    --bg: #0b0b0c;
    --panel: #131315;
    --line: #3a352c;
    --line-soft: #29261f;
    --cream: #f2ead9;
    --cream-dim: #cfc7b3;
    --grey: #948f83;
    --green: #7fae8e;
    --amber: #d1a85e;
    --rose: #c98b7a;
  }
  * { box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--cream-dim); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px 32px 90px; }
  .wrap{ max-width: 640px; margin: 0 auto; }

  .dev-bar{ border: 1px dashed var(--line); padding: 12px 14px; margin-bottom: 14px; }
  .dev-bar .dev-label{ font-size: 10.5px; color: var(--grey); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .dev-bar .dev-buttons{ display:flex; flex-wrap: wrap; gap: 6px; }
  .dev-btn{ background:none; border: 1px solid var(--line); color: var(--cream-dim); padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .dev-btn.active{ border-color: var(--amber); color: var(--amber); }
  .dev-bar.secondary{ margin-bottom: 30px; }
  .dev-btn:disabled{ opacity: 0.35; cursor: default; }
  .dev-summary{ font-size: 11px; color: var(--grey); margin-top: 8px; line-height: 1.5; }
  .dev-summary .ok{ color: var(--green); }
  .dev-summary .no{ color: var(--rose); }
  .dev-annotation{ border: 1px dashed var(--line); padding: 10px 12px; font-size: 11.5px; color: var(--grey); line-height: 1.6; margin-top: 12px; }
  .avail-notice{ border: 1px solid var(--rose); color: var(--rose); font-size: 13px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.5; }

  .back{ color: var(--cream-dim); text-decoration: none; font-size: 14px; display:inline-block; margin-bottom: 20px; opacity: 0.8; }

  /* ---------- Class Detail ---------- */
  .class-graphic{ width: 100%; height: 200px; margin-bottom: 20px; background: linear-gradient(135deg, #23301f, #3a4a2c 45%, #57411f); border: 1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .class-graphic .graphic-label{ font-family: Georgia, serif; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(242,234,217,0.55); }

  h1{ font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 32px; color: var(--cream); margin: 0 0 12px; }
  .class-description{ font-size: 14px; line-height: 1.6; color: var(--cream-dim); margin-bottom: 18px; }

  .class-meta{ display:flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 18px; }
  .class-meta-item{ font-size: 13px; color: var(--grey); }
  .class-meta-item strong{ color: var(--cream-dim); font-weight: 500; }

  .detail-divider{ border: none; border-top: 1px solid var(--line); margin: 30px 0 26px; }
  .register-heading{ font-family: Georgia, serif; font-size: 20px; color: var(--cream); margin: 0 0 18px; }

  /* ---------- Registration form (unchanged pattern) ---------- */
  .section-title{ font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey); margin: 26px 0 14px; }
  .card{ border: 1px solid var(--line); padding: 20px 22px; margin-bottom: 12px; }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--grey); margin-bottom: 6px; }
  .field select, .field input{ width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--cream-dim); padding: 10px 12px; font-size: 14px; font-family: inherit; }
  .field-row{ display:flex; gap: 12px; }
  .field-row .field{ flex:1; }

  .actor-links{ display:flex; gap: 16px; margin: -8px 0 16px; }
  .actor-links .link-btn{ font-size: 12.5px; }
  .actor-links .link-btn.muted{ color: var(--grey); text-decoration: none; }

  .type-detail{ font-size: 13px; color: var(--grey); margin: -8px 0 16px; }

  .method-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 10px; }
  .method-row select{ flex:1; }
  .link-btn{ background:none; border:none; color: var(--amber); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; white-space: nowrap; }

  .card-entry-box{ border: 1px solid var(--line-soft); padding: 16px 18px; margin-bottom: 10px; background: rgba(255,255,255,0.015); }
  .card-entry-title{ font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey); margin-bottom: 12px; }
  .card-error-msg{ display:none; border: 1px solid var(--rose); color: var(--rose); font-size: 13px; padding: 10px 12px; margin-top: 4px; margin-bottom: 12px; }
  .card-error-msg.show{ display:block; }

  .quickfill{ margin-top: 10px; padding: 8px 10px; border: 1px dashed var(--line); }
  .quickfill .qf-label{ font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--grey); margin-bottom: 6px; }
  .qf-buttons{ display:flex; flex-wrap:wrap; gap: 6px; }
  .qf-btn{ background:none; border: 1px solid var(--line-soft); color: var(--grey); padding: 4px 9px; font-size: 10.5px; cursor: pointer; }
  .qf-btn.active{ border-color: var(--amber); color: var(--amber); }

  .auth-amount{ font-family: Georgia, serif; font-size: 26px; color: var(--cream); margin-bottom: 4px; }
  .auth-date{ font-size: 13.5px; color: var(--cream-dim); margin-bottom: 14px; }
  .auth-copy{ font-size: 13px; color: var(--grey); line-height: 1.6; margin-bottom: 16px; }
  .auth-check{ display:flex; align-items:flex-start; gap: 10px; margin-bottom: 20px; font-size: 13.5px; color: var(--cream-dim); }
  .auth-check input{ margin-top: 3px; flex-shrink:0; }

  .btn{ background: none; border: 1px solid var(--amber); color: var(--amber); padding: 12px 22px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; width: 100%; }
  .btn:hover{ background: rgba(209,168,94,0.08); }
  .btn:disabled{ opacity: 0.4; cursor: default; }
  .btn.secondary{ border-color: var(--line); color: var(--cream-dim); width: auto; padding: 10px 18px; }

  .processing-box{ text-align:center; padding: 30px 0; }
  .spinner{ width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--amber); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .success-badge{ text-align:center; margin: 10px 0 20px; }
  .success-badge .checkmark{ width: 50px; height:50px; border: 2px solid var(--green); border-radius: 50%; display:flex; align-items:center; justify-content:center; margin: 0 auto 14px; color: var(--green); font-size: 24px; }
  .success-title{ text-align:center; font-family: Georgia, serif; font-size: 21px; letter-spacing: 0.02em; color: var(--green); text-transform: uppercase; margin-bottom: 22px; }
  .success-card{ border: 1px solid var(--line); padding: 22px 24px; margin-bottom: 20px; }
  .success-name{ font-family: Georgia, serif; font-size: 19px; color: var(--cream); margin-bottom: 2px; }
  .success-sub{ font-size: 13px; color: var(--grey); margin-bottom: 16px; }
  .success-line{ display:flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .success-line:last-of-type{ border-bottom:none; }
  .success-line .k{ color: var(--grey); }
  .success-line .v{ color: var(--cream-dim); }
  .success-line.amt .v{ font-family: Georgia, serif; font-size: 17px; color: var(--cream); }
  .no-charge-note{ font-size: 12.5px; color: var(--grey); text-align:center; margin-top: 4px; }

  .action-stack{ display:flex; flex-direction:column; gap: 10px; margin-top: 20px; }

  .roster-list{ margin-top: 8px; }
  .roster-item{ font-size: 13.5px; color: var(--cream-dim); padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .roster-item:last-child{ border-bottom:none; }
  .roster-item .r-type{ color: var(--grey); }

  .empty-note{ border: 1px solid var(--line-soft); padding: 18px 20px; color: var(--grey); font-size: 13.5px; text-align:center; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="dev-bar">
    <div class="dev-label">Registration Type (dev only)</div>
    <div class="dev-buttons">
      <button class="dev-btn active" id="regtype-full-btn" onclick="setDevRegistrationType('Full Series')">Full Series</button>
      <button class="dev-btn" id="regtype-dropin-btn" onclick="setDevRegistrationType('Drop-In')">Drop-In</button>
    </div>
  </div>
  <div class="dev-bar state-bar">
    <div class="dev-label">Interaction State (dev only)</div>
    <div class="dev-buttons">
      <button class="dev-btn active" data-screen="A">Saved Card</button>
      <button class="dev-btn" data-screen="B">New Parent, No Saved Card</button>
      <button class="dev-btn" data-screen="C">Add New Card</button>
      <button class="dev-btn" data-screen="D">Card Error</button>
      <button class="dev-btn" data-screen="E">Processing</button>
      <button class="dev-btn" data-screen="F">Registration Success</button>
      <button class="dev-btn" data-screen="G">Register Another (Sibling Eligible)</button>
      <button class="dev-btn" data-screen="H">Nobody Else Eligible</button>
    </div>
  </div>
  <div class="dev-bar" id="availability-panel"></div>
  <div class="dev-bar secondary">
    <div class="dev-label">Class graphic (dev only)</div>
    <div class="dev-buttons">
      <button class="dev-btn" id="graphic-on-btn" onclick="setGraphic(true)">Graphic present</button>
      <button class="dev-btn active" id="graphic-off-btn" onclick="setGraphic(false)">No graphic</button>
    </div>
  </div>

  <a class="back" href="#">&larr; Back to Classes</a>

  <div id="class-detail"></div>

  <hr class="detail-divider">
  <div class="register-heading">Register for this Class</div>

  <div id="main-content"></div>

</div>

<script>
const classInfo = {
  title: "Shrek \u2013 Legacy of the Swamp Creatures",
  description: "Head back to the swamp! In this high-energy showcase class, young performers explore favorite songs and scenes inspired by the world of Shrek, building confidence, character work, and ensemble performance skills in a supportive environment. No experience necessary \u2014 just bring your best ogre roar.",
  meetingDays: "Wednesdays",
  dateRange: "September 16 \u2013 November 4, 2026",
  time: "4:00\u20134:30 PM",
  fullSeriesEnabled: true,
  fullSeriesFee: 125.00,
  dropInEnabled: true,
  dropInFee: 50.00
};

let hasGraphic = false;

function setGraphic(value){
  hasGraphic = value;
  document.getElementById("graphic-on-btn").classList.toggle("active", value);
  document.getElementById("graphic-off-btn").classList.toggle("active", !value);
  renderClassDetail();
}

function renderClassDetail(){
  const container = document.getElementById("class-detail");
  const graphicHtml = hasGraphic
    ? `<div class="class-graphic"><span class="graphic-label">${classInfo.title}</span></div>`
    : "";

  container.innerHTML = `
    ${graphicHtml}
    <h1>${classInfo.title}</h1>
    <div class="class-description">${classInfo.description}</div>
    <div class="class-meta">
      <div class="class-meta-item"><strong>${classInfo.meetingDays}</strong></div>
      <div class="class-meta-item"><strong>${classInfo.dateRange}</strong></div>
      <div class="class-meta-item"><strong>${classInfo.time}</strong></div>
    </div>
  `;
}

const allActors = [
  { id:"jackson", name:"Jackson Morris" },
  { id:"morgan", name:"Morgan Morris" }
];

// ================= REGISTRATION AVAILABILITY (parent) =================
// Every class session, in order, with its scheduled START time in Central time. Stable
// indexes: the parent only ever SEES the sessions that are still open, but the selection
// is remembered by its position in this full list so it cannot silently shift to another
// date when earlier sessions close.
//   - Full Series: open only until the scheduled start of the FIRST session.
//   - Drop-In:     each session is open only until the scheduled start of THAT session.
//   - All cutoffs are evaluated in Central time (America/Chicago). In production, compare
//     real instants using the Central time zone rules (DST ends Nov 1, 2026, so the
//     Nov 4 session starts at 4:00 PM CST while the others start at 4:00 PM CDT). This
//     prototype uses a demo clock that is already a Central wall-clock time.
//   - Eligibility is rechecked on submit (see submitRegistration).
// Charge date is the day after the session, at 6:00 PM CT.
const dropInSessions = [
  { start: "2026-09-16T16:00", event: "September 16, 2026", charge: "September 17, 2026" },
  { start: "2026-09-23T16:00", event: "September 23, 2026", charge: "September 24, 2026" },
  { start: "2026-09-30T16:00", event: "September 30, 2026", charge: "October 1, 2026" },
  { start: "2026-10-07T16:00", event: "October 7, 2026", charge: "October 8, 2026" },
  { start: "2026-10-14T16:00", event: "October 14, 2026", charge: "October 15, 2026" },
  { start: "2026-10-21T16:00", event: "October 21, 2026", charge: "October 22, 2026" },
  { start: "2026-10-28T16:00", event: "October 28, 2026", charge: "October 29, 2026" },
  { start: "2026-11-04T16:00", event: "November 4, 2026", charge: "November 5, 2026" }
];

// DEMO clock (Central wall-clock, "YYYY-MM-DDTHH:mm"). Not a business rule: it exists so the
// cutoff behavior can be reviewed. Default is before the first session, which preserves the
// original experience (Full Series and Drop-In both available).
const DEMO_CLOCK_PRESETS = [
  { label: "Before first class", value: "2026-09-09T09:00" },
  { label: "First class day, 3:59 PM", value: "2026-09-16T15:59" },
  { label: "First class started, 4:00 PM", value: "2026-09-16T16:00" },
  { label: "Mid-series", value: "2026-10-14T17:00" },
  { label: "Last class day, 3:59 PM", value: "2026-11-04T15:59" },
  { label: "All closed", value: "2026-11-04T16:00" }
];
let demoNow = DEMO_CLOCK_PRESETS[0].value;

// A cutoff is "until the scheduled start time": open while now is strictly before the start.
function isFullSeriesOpen(){ return classInfo.fullSeriesEnabled && demoNow < dropInSessions[0].start; }
function isSessionOpen(i){ return classInfo.dropInEnabled && demoNow < dropInSessions[i].start; }
function eligibleSessionIndexes(){ return dropInSessions.map((s,i) => i).filter(i => isSessionOpen(i)); }
function firstEligibleIndex(){ const e = eligibleSessionIndexes(); return e.length ? e[0] : 0; }
function availableTypes(){
  const t = [];
  if(isFullSeriesOpen()) t.push("Full Series");
  if(eligibleSessionIndexes().length) t.push("Drop-In");
  return t;
}
// If no registration option remains, the class no longer appears in the parent-facing class list.
function classHasOpenOptions(){ return availableTypes().length > 0; }

let availabilityNotice = null;   // shown once above the form when an option closed under the parent
let closedWhileOpen = false;     // class closed while the parent had the page open

// Is the parent's CURRENT selection still open? Returns a message if not (does not change state).
function selectionClosedNotice(){
  if(registrationType === "Full Series" && !isFullSeriesOpen()){
    return availableTypes().includes("Drop-In")
      ? "Full Series registration closed when the first class began, so your registration was not submitted. You can still register for an available Drop-In date."
      : "Registration for this class closed while you were on this page, so your registration was not submitted.";
  }
  if(registrationType === "Drop-In" && !isSessionOpen(dropInSessionIndex)){
    return eligibleSessionIndexes().length
      ? `Registration for ${dropInSessions[dropInSessionIndex].event} closed when that class began, so your registration was not submitted. Please choose another available date.`
      : "Registration for this class closed while you were on this page, so your registration was not submitted.";
  }
  return null;
}
// Move the selection to the first option that is still open (silent).
function normalizeSelection(){
  const types = availableTypes();
  if(!types.length) return;
  if(!types.includes(registrationType)) registrationType = types[0];
  if(registrationType === "Drop-In" && !isSessionOpen(dropInSessionIndex)) dropInSessionIndex = firstEligibleIndex();
}

let registeredActors = {}; // id -> { type, amount, chargeDateLabel, sessionEvent, cardLabel }
let hasSavedCard = true;
let savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"];
let selectedCardIndex = 0;
let addCardMode = false;
let cardErrorMessage = null;
let currentActorId = "jackson";
let registrationType = "Full Series";
let dropInSessionIndex = 0;
let devCardOutcome = "success";
let lastSuccessActorId = null;

function fmt(n){ return "$" + n.toFixed(2); }

function availableActors(){
  return allActors.filter(a => !registeredActors[a.id]);
}

function computeAmount(type){ return type === "Full Series" ? classInfo.fullSeriesFee : classInfo.dropInFee; }

// Internal processing rule: the actual charge runs at 6:00 PM Central on this date.
// That processing time is not shown in parent-facing UI - only the date is.
function computeChargeDateLabel(type, sessionIdx){
  return type === "Full Series" ? "September 17, 2026" : dropInSessions[sessionIdx].charge;
}

function computeSessionEvent(type, sessionIdx){
  return type === "Drop-In" ? dropInSessions[sessionIdx].event : null;
}

function ensureValidActor(){
  const avail = availableActors();
  if(!avail.find(a => a.id === currentActorId)){
    currentActorId = avail.length ? avail[0].id : null;
  }
}

function renderMain(){
  ensureValidActor();
  const container = document.getElementById("main-content");
  const avail = availableActors();

  if(avail.length === 0){
    renderNobodyEligible(container);
    return;
  }

  // No registration option remains: the class is no longer offered to parents.
  if(!classHasOpenOptions()){
    renderClassClosed(container);
    return;
  }

  // If the selected option closed while this page was open, say so and move to an open option.
  const staleNotice = selectionClosedNotice();
  if(staleNotice){ availabilityNotice = staleNotice; normalizeSelection(); }
  const noticeHtml = availabilityNotice ? `<div class="avail-notice">${availabilityNotice}</div>` : "";
  availabilityNotice = null;

  const amount = computeAmount(registrationType);
  const chargeDateLabel = computeChargeDateLabel(registrationType, dropInSessionIndex);
  const actorOptions = avail.map(a => `<option value="${a.id}"${a.id === currentActorId ? " selected" : ""}>${a.name}</option>`).join("");

  let paymentMethodHtml = "";
  if(!hasSavedCard || addCardMode){
    paymentMethodHtml = `
      <div class="card-entry-box">
        <div class="card-entry-title">${hasSavedCard ? "Add New Card" : "Add a Credit Card"}</div>
        ${cardFieldsHtml()}
        ${cardErrorHtml()}
        ${devCardOutcomeQuickfill()}
        ${addCardMode ? `<button class="link-btn" style="margin-top:12px;" onclick="cancelAddCard()">Cancel &mdash; Use a Saved Card</button>` : ``}
      </div>
    `;
  } else {
    const cardOptions = savedCards.map((c,i) => `<option value="${i}"${i === selectedCardIndex ? " selected" : ""}>${c}</option>`).join("");
    paymentMethodHtml = `
      <div class="method-row">
        <select id="card-select" onchange="selectedCardIndex = parseInt(this.value)">${cardOptions}</select>
      </div>
      <button class="link-btn" onclick="openAddCard()">+ Add New Card</button>
    `;
  }

  const dropInSessionField = registrationType === "Drop-In" ? `
    <div class="field">
      <label>Select Class Date</label>
      <select onchange="dropInSessionIndex = parseInt(this.value); renderMain();">
        ${eligibleSessionIndexes().map(i => `<option value="${i}"${i === dropInSessionIndex ? " selected" : ""}>${dropInSessions[i].event}</option>`).join("")}
      </select>
    </div>` : "";

  const typeOptions = availableTypes();

  const typeDetail = registrationType === "Full Series"
    ? `Full Series: ${fmt(classInfo.fullSeriesFee)} &middot; meets weekly through Nov 4`
    : `Drop-In: ${fmt(classInfo.dropInFee)} per class`;

  container.innerHTML = `
    ${noticeHtml}
    <div class="card">
      <div class="field">
        <label>Select Actor</label>
        <select onchange="currentActorId = this.value; renderMain();">${actorOptions}</select>
      </div>
      <div class="actor-links">
        <button class="link-btn">+ Add an Actor</button>
        <button class="link-btn muted">Manage Actors</button>
      </div>
      <div class="field">
        <label>Registration Type</label>
        <select onchange="registrationType = this.value; dropInSessionIndex = firstEligibleIndex(); renderMain();">
          ${typeOptions.map(t => `<option${t === registrationType ? " selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="type-detail">${typeDetail}</div>
      ${dropInSessionField}
    </div>

    <div class="section-title">Payment Method</div>
    <div class="card">
      ${paymentMethodHtml}
    </div>

    <div class="section-title">Payment Authorization</div>
    <div class="card">
      <div class="auth-amount">${fmt(amount)}</div>
      <div class="auth-date">Scheduled charge: ${chargeDateLabel}</div>
      <div class="auth-copy">
        Your card will not be charged today. By completing registration, you authorize Young Actors Theater Academy LLC to charge ${fmt(amount)} to the payment method selected above on ${chargeDateLabel}.
      </div>
      <label class="auth-check">
        <input type="checkbox" id="auth-checkbox" onchange="onAuthCheckChange()">
        I authorize this future charge.
      </label>
      <button class="btn" id="register-btn" onclick="submitRegistration()" disabled>Register for Class</button>
    </div>
  `;
}

function renderClassClosed(container){
  const msg = closedWhileOpen
    ? "Registration for this class closed while you were on this page, so your registration was not submitted."
    : "Registration for this class is closed.";
  closedWhileOpen = false;
  container.innerHTML = `
    <div class="empty-note">${msg}</div>
    <div class="dev-annotation">Dev note: with no registration option remaining, this class is removed from the parent-facing class list. This page is only reachable through a direct link or a page that was already open.</div>
  `;
}

function cardFieldsHtml(){
  return `
    <div class="field">
      <label>Name on Card</label>
      <input type="text" placeholder="Parent Name">
    </div>
    <div class="field">
      <label>Card Number</label>
      <input type="text" placeholder="1234 1234 1234 1234">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Expiration</label>
        <input type="text" placeholder="MM / YY">
      </div>
      <div class="field">
        <label>CVC</label>
        <input type="text" placeholder="CVC">
      </div>
    </div>
  `;
}

function cardErrorHtml(){
  if(!cardErrorMessage) return "";
  return `<div class="card-error-msg show">${cardErrorMessage}</div>`;
}

function devCardOutcomeQuickfill(){
  return `
    <div class="quickfill">
      <div class="qf-label">Dev: card validation outcome</div>
      <div class="qf-buttons">
        <button type="button" class="qf-btn ${devCardOutcome === 'success' ? 'active' : ''}" onclick="setDevCardOutcome('success')">Valid card</button>
        <button type="button" class="qf-btn ${devCardOutcome === 'declined' ? 'active' : ''}" onclick="setDevCardOutcome('declined')">Card declined</button>
      </div>
    </div>
  `;
}

function setDevCardOutcome(outcome){
  devCardOutcome = outcome;
  renderMain();
}

function onAuthCheckChange(){
  document.getElementById("register-btn").disabled = !document.getElementById("auth-checkbox").checked;
}

function openAddCard(){
  addCardMode = true;
  cardErrorMessage = null;
  renderMain();
}

function cancelAddCard(){
  addCardMode = false;
  cardErrorMessage = null;
  renderMain();
}

function submitRegistration(){
  // Eligibility and the applicable cutoff are rechecked at submit time. An option that closed while
  // the parent had the page open cannot be registered, no new card is saved, and nothing is authorized.
  const closedNotice = selectionClosedNotice();
  if(closedNotice){
    closedWhileOpen = !classHasOpenOptions();
    if(!closedWhileOpen) availabilityNotice = closedNotice;
    normalizeSelection();
    renderMain();
    return;
  }

  if(!hasSavedCard || addCardMode){
    if(devCardOutcome === "declined"){
      cardErrorMessage = "We couldn't verify this card. Please check the details and try again, or use a different card.";
      renderMain();
      return;
    }
    if(!hasSavedCard){
      savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"];
      selectedCardIndex = 0;
    } else if(addCardMode){
      savedCards.push("Visa &bull;&bull;&bull;&bull; 9012");
      selectedCardIndex = savedCards.length - 1;
    }
    hasSavedCard = true;
    addCardMode = false;
    cardErrorMessage = null;
  }

  const amount = computeAmount(registrationType);
  const chargeDateLabel = computeChargeDateLabel(registrationType, dropInSessionIndex);
  const sessionEvent = computeSessionEvent(registrationType, dropInSessionIndex);
  const cardLabel = savedCards[selectedCardIndex];
  const actorId = currentActorId;

  document.getElementById("main-content").innerHTML = `
    <div class="processing-box">
      <div class="spinner"></div>
      <div>Registering&hellip;</div>
    </div>
  `;

  setTimeout(() => {
    registeredActors[actorId] = { type: registrationType, amount, chargeDateLabel, sessionEvent, cardLabel };
    lastSuccessActorId = actorId;
    registrationType = availableTypes()[0] || "Full Series";
    dropInSessionIndex = firstEligibleIndex();
    renderSuccess();
  }, 1200);
}

function renderSuccess(){
  const container = document.getElementById("main-content");
  const actor = allActors.find(a => a.id === lastSuccessActorId);
  const rec = registeredActors[lastSuccessActorId];
  const stillAvailable = availableActors();

  const rosterHtml = Object.keys(registeredActors).map(id => {
    const a = allActors.find(x => x.id === id);
    const r = registeredActors[id];
    const sessionNote = r.sessionEvent ? ` &mdash; ${r.sessionEvent}` : "";
    return `<div class="roster-item">${a.name} <span class="r-type">&mdash; ${r.type}${sessionNote}</span></div>`;
  }).join("");

  container.innerHTML = `
    <div class="success-badge"><div class="checkmark">&#10003;</div></div>
    <div class="success-title">Registration Confirmed</div>

    <div class="success-card">
      <div class="success-name">${actor.name}</div>
      <div class="success-sub">${classInfo.title} &middot; ${rec.type}</div>
      <div class="section-title" style="margin-top:0;">Payment Authorization</div>
      <div class="success-line amt"><span class="k">Amount</span><span class="v">${fmt(rec.amount)}</span></div>
      <div class="success-line"><span class="k">Payment Method</span><span class="v">${rec.cardLabel}</span></div>
      <div class="success-line"><span class="k">Scheduled</span><span class="v">${rec.chargeDateLabel}</span></div>
    </div>
    <div class="no-charge-note">No payment was charged today.</div>

    <div class="action-stack">
      <button class="btn">View My Classes</button>
      ${stillAvailable.length > 0 && classHasOpenOptions() ? `<button class="btn secondary" onclick="renderMain()">Register Another Actor</button>` : ``}
    </div>

    <div class="section-title">Registered for this Class</div>
    <div class="roster-list">${rosterHtml}</div>
  `;
}

function renderNobodyEligible(container){
  const rosterHtml = Object.keys(registeredActors).map(id => {
    const a = allActors.find(x => x.id === id);
    const r = registeredActors[id];
    const sessionNote = r.sessionEvent ? ` &mdash; ${r.sessionEvent}` : "";
    return `<div class="roster-item">${a.name} <span class="r-type">&mdash; ${r.type}${sessionNote}</span></div>`;
  }).join("");

  container.innerHTML = `
    <div class="empty-note">&#10003; Your eligible actors are already registered for this class.</div>
    <div class="section-title">Registered for this Class</div>
    <div class="roster-list">${rosterHtml}</div>
  `;
}

// ---------- Dev bar direct-jump controls ----------
let devRegistrationType = "Full Series";
let devRegistrationPreference = "Full Series";   // the dev's explicit choice; used whenever that option is open
let currentDevLetter = "A";

function formatDemoClock(v){
  const [d, t] = v.split("T"); const [y, m, day] = d.split("-").map(Number); const [hh, mm] = t.split(":").map(Number);
  const wk = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(Date.UTC(y, m - 1, day)).getUTCDay()];
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1];
  const h12 = hh % 12 || 12;
  return `${wk}, ${mo} ${day}, ${y}, ${h12}:${String(mm).padStart(2, "0")} ${hh >= 12 ? "PM" : "AM"} CT`;
}
function startLabel(v){ return formatDemoClock(v).replace(/^[A-Za-z]{3}, /, ""); }

function renderAvailabilityPanel(){
  const fsOpen = isFullSeriesOpen();
  const dropInOpen = eligibleSessionIndexes().length;
  const listed = classHasOpenOptions();
  const presets = DEMO_CLOCK_PRESETS.map(pz => `<button class="dev-btn${pz.value === demoNow ? " active" : ""}" onclick="setDemoClock('${pz.value}')">${pz.label}</button>`).join("");
  const [clockDate, clockYear, clockTime] = startLabel(demoNow).split(", ");
  const state = (ok, yes, no) => `<span class="${ok ? "ok" : "no"}">${ok ? yes : no}</span>`;
  document.getElementById("availability-panel").innerHTML = `
    <div class="dev-label">Demo Clock &mdash; Central Time (dev only)</div>
    <div class="dev-buttons">${presets}</div>
    <div class="dev-summary">Current: ${clockDate}, ${clockYear} &middot; ${clockTime}</div>
    <div class="dev-summary">Full Series: ${state(fsOpen, "Open", "Closed")} &middot; Drop-In dates: ${state(dropInOpen > 0, dropInOpen + " open", "0 open")} &middot; Class: ${state(listed, "Listed", "Not listed")}</div>
    <div class="dev-buttons" style="margin-top:8px;"><button class="dev-btn" id="pass-cutoff-btn" onclick="devPassSelectedCutoff()"${listed ? "" : " disabled"}>Simulate selected option closing before submit</button></div>
  `;
  // Registration Type dev buttons reflect what is actually open
  const fullBtn = document.getElementById("regtype-full-btn"), dropBtn = document.getElementById("regtype-dropin-btn");
  fullBtn.disabled = !fsOpen;
  dropBtn.disabled = eligibleSessionIndexes().length === 0;
  const types = availableTypes();
  if(types.length) devRegistrationType = types.includes(devRegistrationPreference) ? devRegistrationPreference : types[0];
  fullBtn.classList.toggle("active", devRegistrationType === "Full Series");
  dropBtn.classList.toggle("active", devRegistrationType === "Drop-In");
}

function setDemoClock(value){
  demoNow = value;
  renderAvailabilityPanel();
  goToDevScreen(currentDevLetter);
}

// Moves the clock to the selected option's cutoff WITHOUT re-rendering the registration form,
// to simulate a parent who loaded the page before the cutoff and submits after it.
function devPassSelectedCutoff(){
  const cutoff = registrationType === "Full Series" ? dropInSessions[0].start : dropInSessions[dropInSessionIndex].start;
  if(demoNow < cutoff) demoNow = cutoff;
  renderAvailabilityPanel();   // the summary line shows the new time; the registration form is intentionally not refreshed
}

function setDevRegistrationType(type){
  devRegistrationType = type;
  devRegistrationPreference = type;
  document.getElementById("regtype-full-btn").classList.toggle("active", type === "Full Series");
  document.getElementById("regtype-dropin-btn").classList.toggle("active", type === "Drop-In");
  goToDevScreen(currentDevLetter);
}

function goToDevScreen(letter){
  currentDevLetter = letter;
  availabilityNotice = null; closedWhileOpen = false;
  document.querySelectorAll('.dev-bar.state-bar .dev-btn').forEach(b => b.classList.toggle("active", b.dataset.screen === letter));

  if(letter === "A"){
    registeredActors = {};
    hasSavedCard = true; savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"]; selectedCardIndex = 0;
    addCardMode = false; cardErrorMessage = null; currentActorId = "jackson";
    registrationType = devRegistrationType; dropInSessionIndex = firstEligibleIndex(); normalizeSelection();
    renderMain();
  } else if(letter === "B"){
    registeredActors = {};
    hasSavedCard = false; savedCards = []; selectedCardIndex = 0;
    addCardMode = false; cardErrorMessage = null; currentActorId = "jackson";
    registrationType = devRegistrationType; dropInSessionIndex = firstEligibleIndex(); normalizeSelection();
    devCardOutcome = "success";
    renderMain();
  } else if(letter === "C"){
    registeredActors = {};
    hasSavedCard = true; savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"]; selectedCardIndex = 0;
    addCardMode = true; cardErrorMessage = null; currentActorId = "jackson";
    registrationType = devRegistrationType; dropInSessionIndex = firstEligibleIndex(); normalizeSelection();
    devCardOutcome = "success";
    renderMain();
  } else if(letter === "D"){
    registeredActors = {};
    hasSavedCard = false; savedCards = []; selectedCardIndex = 0;
    addCardMode = false; currentActorId = "jackson";
    registrationType = devRegistrationType; dropInSessionIndex = firstEligibleIndex(); normalizeSelection();
    devCardOutcome = "declined";
    cardErrorMessage = "We couldn't verify this card. Please check the details and try again, or use a different card.";
    renderMain();
  } else if(letter === "E"){
    document.getElementById("main-content").innerHTML = `
      <div class="processing-box">
        <div class="spinner"></div>
        <div>Registering&hellip;</div>
      </div>
    `;
  } else if(letter === "F"){
    const type = availableTypes().includes(devRegistrationType) ? devRegistrationType : (availableTypes()[0] || devRegistrationType);
    const idx = firstEligibleIndex();
    registeredActors = { jackson: {
      type, amount: computeAmount(type), chargeDateLabel: computeChargeDateLabel(type, idx),
      sessionEvent: computeSessionEvent(type, idx), cardLabel:"Visa &bull;&bull;&bull;&bull; 4242"
    } };
    lastSuccessActorId = "jackson";
    hasSavedCard = true; savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"]; selectedCardIndex = 0;
    addCardMode = false; cardErrorMessage = null;
    renderSuccess();
  } else if(letter === "G"){
    const type = availableTypes().includes(devRegistrationType) ? devRegistrationType : (availableTypes()[0] || devRegistrationType);
    const idx = firstEligibleIndex();
    registeredActors = { jackson: {
      type, amount: computeAmount(type), chargeDateLabel: computeChargeDateLabel(type, idx),
      sessionEvent: computeSessionEvent(type, idx), cardLabel:"Visa &bull;&bull;&bull;&bull; 4242"
    } };
    hasSavedCard = true; savedCards = ["Visa &bull;&bull;&bull;&bull; 4242"]; selectedCardIndex = 0;
    addCardMode = false; cardErrorMessage = null;
    currentActorId = "morgan";
    registrationType = devRegistrationType; dropInSessionIndex = firstEligibleIndex(); normalizeSelection();
    renderMain();
  } else if(letter === "H"){
    // Nobody Else Eligible is a completed-roster snapshot, not a live registration in
    // progress, so it intentionally shows one of each type (rather than following the
    // Registration Type toggle) to demonstrate that a roster can correctly contain a mix.
    registeredActors = {
      jackson: { type:"Full Series", amount:classInfo.fullSeriesFee, chargeDateLabel:"September 17, 2026", sessionEvent:null, cardLabel:"Visa &bull;&bull;&bull;&bull; 4242" },
      morgan: { type:"Drop-In", amount:classInfo.dropInFee, chargeDateLabel:"October 8, 2026", sessionEvent:"October 7, 2026", cardLabel:"Visa &bull;&bull;&bull;&bull; 4242" }
    };
    renderMain();
  }
}

document.querySelectorAll('.dev-bar.state-bar .dev-btn').forEach(btn => {
  btn.addEventListener("click", () => goToDevScreen(btn.dataset.screen));
});

renderClassDetail();
renderAvailabilityPanel();
goToDevScreen("A");
</script>
</body>
</html>
